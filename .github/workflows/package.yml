name: Package editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run test
      - run: mise run install-editor
      - run: mise run check-editor
      - run: mise run package-editor
      - uses: actions/upload-artifact@v4
        with:
          name: kartui-editor
          path: dist/editor/*.vsix
